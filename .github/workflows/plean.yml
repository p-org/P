name: PLean

# Builds PLean, runs its regression tests, verifies the examples, and replays
# the built library and examples through Lean's kernel with `leanchecker`.
# `#pverify` checks what its theorems rest on, but code that runs during
# `#pverify` itself is trusted; `leanchecker` checks a built module whole.

on:
  push:
    paths:
      - "Src/PLean/**"
      - ".github/workflows/plean.yml"
  pull_request:
    paths:
      - "Src/PLean/**"
      - ".github/workflows/plean.yml"
  workflow_dispatch:

jobs:
  build-test-check:
    name: Build, test, verify, check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Src/PLean
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The build, the bundled solvers and the proof cache. A cached proof is
      # replayed through the kernel, so a stale entry only misses.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            Src/PLean/.lake
          key: plean-${{ runner.os }}-${{ hashFiles('Src/PLean/lean-toolchain', 'Src/PLean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            plean-${{ runner.os }}-${{ hashFiles('Src/PLean/lean-toolchain', 'Src/PLean/lake-manifest.json') }}-

      - name: Build the library
        run: lake build PLean

      # Other solver versions find other counterexamples than the tests pin.
      - name: Put the bundled solvers first on PATH
        run: echo "$GITHUB_WORKSPACE/Src/PLean/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Regression tests
        run: lake build Tests

      # One example module at a time, with more time per solver call: solver
      # timeouts are wall-clock, and this machine is slower than a desktop.
      # (`-R` applies the setting; the lakefile reads it.)
      - name: Verify the examples
        run: |
          lake build -R -KpverifyTimeout=60 PLean
          for m in $(find Examples -name '*.lean' | sed 's|/|.|g; s|\.lean$||' | sort); do
            echo "::group::$m"
            lake build -KpverifyTimeout=60 "$m"
            echo "::endgroup::"
          done

      # One module per run: `leanchecker` crashes when one call replays
      # several. (`PLean.lean` only imports.)
      - name: Replay the library and the examples through the kernel
        run: |
          status=0
          for m in $(find PLean Examples -name '*.lean' | sed 's|/|.|g; s|\.lean$||' | sort); do
            lake env leanchecker "$m" || { echo "leanchecker rejects $m"; status=1; }
          done
          exit $status

      # This test declares theorems without the kernel on purpose, to check
      # `#pverify`'s own check; `leanchecker` must reject it.
      - name: leanchecker rejects declarations made without the kernel
        run: |
          if lake env leanchecker Tests.Verify.KernelCheck > /dev/null 2>&1; then
            echo "leanchecker accepted Tests.Verify.KernelCheck, which forges declarations"
            exit 1
          fi
